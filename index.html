<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compras y Almacén v2.4</title><style>body{font:16px system-ui;background:#f2f6f5;color:#183b35;margin:0}header{background:#145e50;color:white;padding:18px}main{max-width:1050px;margin:auto;padding:16px}nav{display:flex;gap:6px;flex-wrap:wrap}button{cursor:pointer;background:#146b59;color:white;border:0;border-radius:7px;padding:10px;margin:3px}nav button{background:#dcece7;color:#174d42}.panel{background:white;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}input,select,textarea{padding:10px;margin:5px 0;width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:6px}label{display:block;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left} .scroll{overflow:auto}.muted{color:#667} .danger{background:#a33} .hidden{display:none}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script></head><body><header><h2>Compras y Almacén · v2.4</h2><small>Prototipo local · los datos se guardan únicamente en este navegador</small></header><main><nav id="nav"></nav><section id="app"></section></main><script>
const KEY='compras_almacen_demo_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{proveedores:[],productos:[],proyectos:[],facturas:[],movimientos:[],gastos:[]}}catch{db={proveedores:[],productos:[],proyectos:[],facturas:[],movimientos:[],gastos:[]}};const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const id=()=>crypto.randomUUID();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});const get=(k,i)=>db[k].find(x=>x.id===i);const name=(k,i)=>get(k,i)?.nombre||'—';const opt=k=>db[k].map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join('');const tab=(heads,rows)=>`<div class="scroll"><table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>`;const field=(n,t='text',extra='')=>`<label>${n}<input name="${n}" type="${t}" ${extra} required></label>`;const formData=f=>Object.fromEntries(new FormData(f));const qty=(pid)=>db.facturas.filter(x=>x.producto===pid).reduce((s,x)=>s+Number(x.cantidad),0)+db.movimientos.filter(x=>x.producto===pid).reduce((s,x)=>s+(x.tipo==='devolucion'?Number(x.cantidad):-Number(x.cantidad)),0);const stockCost=pid=>{let purchases=db.facturas.filter(x=>x.producto===pid);let total=purchases.reduce((s,x)=>s+Number(x.cantidad)*Number(x.precio),0),count=purchases.reduce((s,x)=>s+Number(x.cantidad),0);return count?total/count:0};const voice=(target)=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Dictado no disponible en este navegador. Puedes usar el micrófono del teclado.');let r=new SR();r.lang='es-MX';r.onresult=e=>{target.value=e.results[0][0].transcript};r.start()};function voiceButtons(){document.querySelectorAll('input[type=text],textarea').forEach(x=>{let b=document.createElement('button');b.type='button';b.textContent='🎙 Dictar';b.onclick=()=>voice(x);x.after(b)})}function section(html){document.querySelector('#app').innerHTML=html;voiceButtons();document.querySelectorAll(".record-edit").forEach(b=>b.addEventListener("click",()=>editRecord(b.dataset.kind,b.dataset.id)));document.querySelectorAll(".record-delete").forEach(b=>b.addEventListener("click",()=>deleteRecord(b.dataset.kind,b.dataset.id)))}let current='Inicio';const tabs=['Inicio','Proveedores','Productos','Proyectos','Facturas','Almacén','Gastos','Reportes','Respaldo'];document.querySelector('#nav').innerHTML=tabs.map(t=>`<button data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));function show(t){current=t;let html='';if(t==='Inicio'){let purchased=db.facturas.reduce((s,x)=>s+x.cantidad*x.precio,0),spent=db.movimientos.filter(x=>x.tipo==='asignacion').reduce((s,x)=>s+x.cantidad*x.costo,0);html=`<div class="panel"><h2>Resumen</h2><p>Compras registradas: <b>${money(purchased)}</b></p><p>Material asignado a proyectos: <b>${money(spent)}</b></p><p>Facturas / partidas: ${db.facturas.length} · Proyectos: ${db.proyectos.length}</p><p class="muted">Para empezar: registra proveedor, producto y proyecto; después una compra.</p></div>`}
if(t==='Proveedores'||t==='Productos'||t==='Proyectos'){let k=t.toLowerCase(),extra=k==='proveedores'?field('telefono')+field('correo','email'):k==='productos'?field('unidad')+field('costo','number','step="0.01" min="0"')+field('marca')+field('modelo')+field('especificaciones')+`<label>Enlace a ficha técnica<input name="datasheet" type="url" placeholder="https://..."></label>`:`<label>Presupuesto opcional<input name="presupuesto" type="number" step="0.01" min="0"></label>`;let rows=db[k].map(x=>{let detail=k==='productos'?[esc(x.nombre),esc(x.unidad),money(x.costo),x.datasheet?`<a href="${esc(x.datasheet)}" target="_blank" rel="noopener">Abrir</a>`:'—']:[esc(x.nombre),k==='proveedores'?esc(x.correo):x.presupuesto?money(x.presupuesto):'Sin presupuesto'];detail.push(`<button type="button" class="record-edit" data-kind="${k}" data-id="${esc(x.id)}">Editar</button> <button type="button" class="danger record-delete" data-kind="${k}" data-id="${esc(x.id)}">Eliminar</button>`);return detail});html=`<div class="panel"><h2>${t}</h2><form id="add">${field('nombre')}${extra}<button>Guardar</button></form></div><div class="panel">${tab(k==='productos'?['Nombre','Unidad','Costo','Ficha técnica','Acciones']:['Nombre','Detalle','Acciones'],rows)}</div>`}
if(t==='Facturas'){html=`<div class="panel"><h2>Importar factura / compra</h2><p class="muted">Carga XML CFDI o PDF. La información se muestra antes de guardar y puedes editarla.</p><div><label>📄 Importar XML CFDI<input id="xmlFile" type="file" accept=".xml,text/xml,application/xml"></label><label>📕 Importar PDF<input id="pdfFile" type="file" accept=".pdf,application/pdf"></label></div><div id="invoiceDraft"></div></div><div class="panel"><h2>Captura manual</h2><form id="add"><label>Proveedor<select name="proveedor" required>${opt('proveedores')}</select></label>${field('folio')}${field('fecha','date')}<label>Producto<select name="producto">${opt('productos')}</select></label>${field('cantidad','number','min="0.001" step="0.001"')}${field('precio','number','min="0" step="0.01"')}<button>Agregar partida</button></form></div><div class="panel">${tab(['Proveedor','Folio','Producto','Cantidad','Importe','Acciones'],db.facturas.map(x=>[esc(name('proveedores',x.proveedor)),esc(x.folio),esc(name('productos',x.producto)),x.cantidad,money(x.cantidad*x.precio),`<button type="button" class="record-edit" data-kind="facturas" data-id="${esc(x.id)}">Editar</button> <button type="button" class="danger record-delete" data-kind="facturas" data-id="${esc(x.id)}">Eliminar</button>`]))}</div>`}
if(t==='Almacén'){html=`<div class="panel"><h2>Inventario</h2>${tab(['Producto','Disponible','Costo promedio','Valor estimado'],db.productos.map(x=>[esc(x.nombre),`${qty(x.id)} ${esc(x.unidad)}`,money(stockCost(x.id)),money(qty(x.id)*stockCost(x.id))]))}</div><div class="panel"><h3>Asignar o devolver material</h3><form id="add"><label>Movimiento<select name="tipo"><option value="asignacion">Asignar a proyecto</option><option value="devolucion">Devolver al almacén</option></select></label><label>Proyecto<select name="proyecto">${opt('proyectos')}</select></label><label>Producto<select name="producto">${opt('productos')}</select></label>${field('cantidad','number','min="0.001" step="0.001"')}<button>Registrar movimiento</button></form></div><div class="panel">${tab(['Tipo','Proyecto','Producto','Cantidad','Acciones'],db.movimientos.map(x=>[esc(x.tipo),esc(name('proyectos',x.proyecto)),esc(name('productos',x.producto)),x.cantidad,`<button type="button" class="record-edit" data-kind="movimientos" data-id="${esc(x.id)}">Editar</button> <button type="button" class="danger record-delete" data-kind="movimientos" data-id="${esc(x.id)}">Eliminar</button>`]))}</div>`}
if(t==='Gastos'){html=`<div class="panel"><h2>Gastos adicionales por proyecto</h2><form id="add"><label>Proyecto<select name="proyecto">${opt('proyectos')}</select></label>${field('concepto')}${field('proveedor')}${field('importe','number','min="0" step="0.01"')}<button>Guardar gasto</button></form></div><div class="panel">${tab(['Proyecto','Concepto','Proveedor','Importe','Acciones'],db.gastos.map(x=>[esc(name('proyectos',x.proyecto)),esc(x.concepto),esc(x.proveedor),money(x.importe),`<button type="button" class="record-edit" data-kind="gastos" data-id="${esc(x.id)}">Editar</button> <button type="button" class="danger record-delete" data-kind="gastos" data-id="${esc(x.id)}">Eliminar</button>`]))}</div>`}
if(t==='Reportes'){html=`<div class="panel"><h2>Gasto por proyecto</h2>${tab(['Proyecto','Material asignado neto','Otros gastos','Total','Presupuesto'],db.proyectos.map(p=>{let material=db.movimientos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+(x.tipo==='asignacion'?1:-1)*x.cantidad*x.costo,0),other=db.gastos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+Number(x.importe),0);return [esc(p.nombre),money(material),money(other),money(material+other),p.presupuesto?money(p.presupuesto):'No definido']}))}<button onclick="downloadCSV()">Exportar reporte CSV (Excel)</button></div>`}
if(t==='Respaldo'){html=`<div class="panel"><h2>Respaldo</h2><p>Descarga todos los registros en un archivo JSON para conservarlos antes de cambiar de equipo.</p><button onclick="backup()">Descargar respaldo</button><label>Restaurar respaldo JSON<input id="restore" type="file" accept=".json,application/json"></label><p class="muted">La información de esta versión NO se sincroniza entre dispositivos. No guardes datos sensibles en una publicación pública.</p></div>`}section(html);let f=document.querySelector('#add');if(f)f.onsubmit=e=>{e.preventDefault();let x=formData(f);if(t==='Almacén'){let n=Number(x.cantidad);if(n<=0)return alert('Cantidad inválida');let available=qty(x.producto);if(x.tipo==='asignacion'&&n>available)return alert('No hay suficiente material');if(x.tipo==='devolucion'){let assigned=db.movimientos.filter(m=>m.proyecto===x.proyecto&&m.producto===x.producto).reduce((s,m)=>s+(m.tipo==='asignacion'?1:-1)*m.cantidad,0);if(n>assigned)return alert('La devolución supera lo asignado a este proyecto')}x.costo=stockCost(x.producto)}if(t==='Facturas'){if(!x.producto||!x.proveedor)return alert('Registra primero proveedor y producto');if(db.facturas.some(a=>a.proveedor===x.proveedor&&a.folio===x.folio&&a.producto===x.producto))return alert('Ya existe este producto en esa factura');}for(let key of ['cantidad','precio','importe','costo','presupuesto'])if(x[key]!==undefined&&x[key]!=='')x[key]=Number(x[key]);if(['Facturas','Almacén'].includes(t)&&(!Number.isFinite(x.cantidad)||x.cantidad<=0))return alert('Cantidad inválida');db[t==='Almacén'?'movimientos':t.toLowerCase()].push({...x,id:id()});save();show(t)};document.querySelector('#xmlFile')?.addEventListener('change',e=>{if(e.target.files[0])importXMLFile(e.target.files[0])});document.querySelector('#pdfFile')?.addEventListener('change',e=>{if(e.target.files[0])importPDFFile(e.target.files[0])});let restore=document.querySelector('#restore');if(restore)restore.onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!['proveedores','productos','proyectos','facturas','movimientos','gastos'].every(k=>Array.isArray(d[k])))throw Error();if(confirm('¿Reemplazar los datos actuales con este respaldo?')){db=d;save();show('Inicio')}}catch{alert('Archivo de respaldo no válido')}}}
function download(content,filename,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(JSON.stringify(db,null,2),'respaldo-compras.json','application/json')}function downloadCSV(){let rows=[['Proyecto','Material','Otros gastos','Total']];db.proyectos.forEach(p=>{let m=db.movimientos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+(x.tipo==='asignacion'?1:-1)*x.cantidad*x.costo,0),g=db.gastos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+Number(x.importe),0);rows.push([p.nombre,m.toFixed(2),g.toFixed(2),(m+g).toFixed(2)])});download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'gastos-por-proyecto.csv','text/csv;charset=utf-8')}async function parseXMLInvoice(file){
 const text=await file.text(), xml=new DOMParser().parseFromString(text,'application/xml');
 if(xml.querySelector('parsererror')) throw Error('El XML no es válido');
 const all=(name)=>Array.from(xml.getElementsByTagNameNS('*',name));
 const attr=(el,n)=>el?.getAttribute(n)||'';
 const comp=all('Comprobante')[0], em=all('Emisor')[0], rec=all('Receptor')[0], tim=all('TimbreFiscalDigital')[0];
 if(!comp) throw Error('No se encontró el nodo Comprobante del CFDI');
 const concepts=all('Concepto');
 const subtotal=Number(attr(comp,'SubTotal')||0), total=Number(attr(comp,'Total')||0);
 let iva=0; all('Traslado').forEach(x=>{if((attr(x,'Impuesto')||'')==='002') iva+=Number(attr(x,'Importe')||0)});
 const proveedorNombre=attr(em,'Nombre')||attr(em,'Rfc')||'';
 let proveedor=db.proveedores.find(p=>(p.rfc||'').toUpperCase()===attr(em,'Rfc').toUpperCase());
 if(!proveedor && proveedorNombre) {proveedor={id:id(),nombre:proveedorNombre,rfc:attr(em,'Rfc'),telefono:'',correo:''};db.proveedores.push(proveedor)}
 const rows=concepts.map(c=>{const descripcion=attr(c,'Descripcion');let prod=db.productos.find(p=>p.nombre.trim().toLowerCase()===descripcion.trim().toLowerCase());if(!prod){prod={id:id(),nombre:descripcion,unidad:attr(c,'Unidad')||attr(c,'ClaveUnidad')||'',costo:Number(attr(c,'ValorUnitario')||0),marca:'',modelo:'',especificaciones:'',datasheet:''};db.productos.push(prod)}return {id:id(),proveedor:proveedor?.id||'',folio:attr(comp,'Folio'),fecha:(attr(comp,'Fecha')||'').slice(0,10),producto:prod.id,cantidad:Number(attr(c,'Cantidad')||0),precio:Number(attr(c,'ValorUnitario')||0),descuento:Number(attr(c,'Descuento')||0),unidad:attr(c,'Unidad')||attr(c,'ClaveUnidad')||'',descripcion,uuid:attr(tim,'UUID'),rfcEmisor:attr(em,'Rfc'),rfcReceptor:attr(rec,'Rfc'),subtotal,iva,total,origen:'XML',archivo:file.name}});
 if(!rows.length) throw Error('El CFDI no contiene conceptos');
 return {rows,uuid:attr(tim,'UUID'),proveedor:proveedor?.id||'',proveedorNombre,folio:attr(comp,'Folio'),fecha:(attr(comp,'Fecha')||'').slice(0,10),subtotal,iva,total,archivo:file.name};
}
function renderDraft(d){const box=document.querySelector('#invoiceDraft');if(!box)return;box.innerHTML=`<div class="panel"><h3>Revisión antes de guardar</h3><p><b>Archivo:</b> ${esc(d.archivo||'—')} · <b>UUID:</b> ${esc(d.uuid||'No encontrado')}</p><label>Proveedor<select id="draftProv">${opt('proveedores')}</select></label>${field('draftFolio')}${field('draftFecha','date')}${field('draftSubtotal','number','step="0.01"')}${field('draftIva','number','step="0.01"')}${field('draftTotal','number','step="0.01"')}<div id="draftRows"></div><button type="button" id="saveDraft">💾 Guardar factura</button><button type="button" class="danger" id="cancelDraft">Cancelar</button></div>`;
 document.querySelector('#draftProv').value=d.proveedor||'';document.querySelector('[name=draftFolio]').value=d.folio||'';document.querySelector('[name=draftFecha]').value=d.fecha||'';document.querySelector('[name=draftSubtotal]').value=d.subtotal||0;document.querySelector('[name=draftIva]').value=d.iva||0;document.querySelector('[name=draftTotal]').value=d.total||0;
 document.querySelector('#draftRows').innerHTML=`<div class="scroll"><table><tr><th>Producto</th><th>Descripción</th><th>Cantidad</th><th>Precio</th><th>Descuento</th></tr>${d.rows.map((r,i)=>`<tr><td><select data-r="${i}" data-k="producto">${opt('productos')}</select></td><td><input data-r="${i}" data-k="descripcion" value="${esc(r.descripcion)}"></td><td><input data-r="${i}" data-k="cantidad" type="number" step="0.001" value="${r.cantidad}"></td><td><input data-r="${i}" data-k="precio" type="number" step="0.01" value="${r.precio}"></td><td><input data-r="${i}" data-k="descuento" type="number" step="0.01" value="${r.descuento||0}"></td></tr>`).join('')}</table></div>`;
 d.rows.forEach((r,i)=>{const el=document.querySelector(`[data-r="${i}"][data-k="producto"]`);if(el)el.value=r.producto});
 document.querySelector('#saveDraft').onclick=()=>{if(d.uuid&&db.facturas.some(x=>x.uuid===d.uuid))return alert('Esta factura ya fue importada: UUID duplicado.');const prov=document.querySelector('#draftProv').value;if(!prov)return alert('Selecciona un proveedor.');const folio=document.querySelector('[name=draftFolio]').value,fecha=document.querySelector('[name=draftFecha]').value;d.rows.forEach((r,i)=>{document.querySelectorAll(`[data-r="${i}"]`).forEach(el=>r[el.dataset.k]=el.type==='number'?Number(el.value):el.value);r.proveedor=prov;r.folio=folio;r.fecha=fecha;r.subtotal=Number(document.querySelector('[name=draftSubtotal]').value||0);r.iva=Number(document.querySelector('[name=draftIva]').value||0);r.total=Number(document.querySelector('[name=draftTotal]').value||0)});db.facturas.push(...d.rows);save();alert('Factura guardada correctamente.');show('Facturas')};document.querySelector('#cancelDraft').onclick=()=>{box.innerHTML=''};
}
async function importXMLFile(file){try{const d=await parseXMLInvoice(file);renderDraft(d)}catch(e){alert('No se pudo importar el XML: '+e.message)}}
async function importPDFFile(file){try{if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n'}const rfc=(text.match(/\b[A-Z&Ñ]{3,4}\d{6}[A-Z0-9]{3}\b/i)||[])[0]||'';const uuid=(text.match(/\b[0-9A-F]{8}-[0-9A-F]{4}-[1-5][0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}\b/i)||[])[0]||'';const total=(text.match(/TOTAL[^0-9]*\$?\s*([\d,]+\.\d{2})/i)||[])[1]?.replace(/,/g,'')||'';const folio=(text.match(/(?:Folio|Folio fiscal|No\. de factura)\s*[:#-]?\s*([A-Z0-9-]+)/i)||[])[1]||'';const fecha=(text.match(/(20\d{2})[-\/]([01]\d)[-\/]([0-3]\d)/)||[]);const d={rows:[{id:id(),proveedor:'',folio,fecha:fecha?`${fecha[1]}-${fecha[2]}-${fecha[3]}`:'',producto:'',cantidad:1,precio:Number(total||0),descuento:0,descripcion:'Revisar concepto importado desde PDF',uuid,rfcEmisor:rfc,subtotal:Number(total||0),iva:0,total:Number(total||0),origen:'PDF',archivo:file.name}],uuid,proveedor:'',proveedorNombre:'',folio,fecha:fecha?`${fecha[1]}-${fecha[2]}-${fecha[3]}`:'',subtotal:Number(total||0),iva:0,total:Number(total||0),archivo:file.name};renderDraft(d);const box=document.querySelector('#invoiceDraft');box.insertAdjacentHTML('beforeend',`<div class="panel"><b>Texto extraído del PDF:</b><textarea style="min-height:160px" readonly>${esc(text.slice(0,20000))}</textarea><p class="muted">El PDF se usa como fuente de revisión. Si los conceptos no se detectan correctamente, edítalos antes de guardar.</p></div>`)}catch(e){alert('No se pudo leer el PDF: '+e.message)}}
function deleteRecord(k,i){let x=get(k,i);if(!x)return;if(k==='facturas'){if(!confirm('¿Eliminar esta partida de factura?\nProveedor: '+name('proveedores',x.proveedor)+'\nFolio: '+(x.folio||'—')+'\nProducto: '+name('productos',x.producto)))return;db.facturas=db.facturas.filter(a=>a.id!==i);save();show(current);return}if(k==='movimientos'){if(!confirm('¿Eliminar este movimiento de almacén?\nTipo: '+(x.tipo||'—')+'\nProyecto: '+name('proyectos',x.proyecto)+'\nProducto: '+name('productos',x.producto)+'\nCantidad: '+(x.cantidad||0)))return;db.movimientos=db.movimientos.filter(a=>a.id!==i);save();show(current);return}if(k==='gastos'){if(!confirm('¿Eliminar este gasto?\nProyecto: '+name('proyectos',x.proyecto)+'\nConcepto: '+(x.concepto||'—')+'\nImporte: '+money(x.importe)))return;db.gastos=db.gastos.filter(a=>a.id!==i);save();show(current);return}let used=k==='productos'&&(db.facturas.some(a=>a.producto===i)||db.movimientos.some(a=>a.producto===i))||k==='proveedores'&&db.facturas.some(a=>a.proveedor===i)||k==='proyectos'&&(db.movimientos.some(a=>a.proyecto===i)||db.gastos.some(a=>a.proyecto===i));if(used)return alert('No se puede eliminar: tiene compras, movimientos o gastos relacionados. Conserva el historial.');if(!confirm('¿Eliminar '+x.nombre+'?'))return;db[k]=db[k].filter(a=>a.id!==i);save();show(current)}
function editRecord(k,i){let x=get(k,i);if(!x)return;let f=document.querySelector('#add');if(!f)return;for(let [key,value] of Object.entries(x)){let input=Array.from(f.elements).find(el=>el.name===key);if(input)input.value=value??''}let btn=f.querySelector('button[type=submit],button:not([type])');if(btn)btn.textContent='Guardar cambios';let cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancelar edición';cancel.className='danger';cancel.onclick=()=>show(current);f.appendChild(cancel);f.onsubmit=e=>{e.preventDefault();let data=formData(f);for(let key of ['cantidad','precio','importe','costo','presupuesto','descuento'])if(data[key]!==undefined&&data[key]!=='')data[key]=Number(data[key]);if(k==='facturas'){if(!data.producto||!data.proveedor)return alert('Registra primero proveedor y producto');if(db.facturas.some(a=>a.id!==i&&a.proveedor===data.proveedor&&a.folio===data.folio&&a.producto===data.producto))return alert('Ya existe este producto en esa factura')}Object.assign(x,data);save();show(current)};f.scrollIntoView({behavior:'smooth',block:'start'})}
