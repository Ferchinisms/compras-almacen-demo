<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compras y Almacén</title><style>body{font:16px system-ui;background:#f2f6f5;color:#183b35;margin:0}header{background:#145e50;color:white;padding:18px}main{max-width:1050px;margin:auto;padding:16px}nav{display:flex;gap:6px;flex-wrap:wrap}button{cursor:pointer;background:#146b59;color:white;border:0;border-radius:7px;padding:10px;margin:3px}nav button{background:#dcece7;color:#174d42}.panel{background:white;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}input,select,textarea{padding:10px;margin:5px 0;width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:6px}label{display:block;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left} .scroll{overflow:auto}.muted{color:#667} .danger{background:#a33} .hidden{display:none}</style></head><body><header><h2>Compras y Almacén</h2><small>Prototipo local · los datos se guardan únicamente en este navegador</small></header><main><nav id="nav"></nav><section id="app"></section></main><script>
const KEY='compras_almacen_demo_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{proveedores:[],productos:[],proyectos:[],facturas:[],movimientos:[],gastos:[]}}catch{db={proveedores:[],productos:[],proyectos:[],facturas:[],movimientos:[],gastos:[]}};const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const id=()=>crypto.randomUUID();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});const get=(k,i)=>db[k].find(x=>x.id===i);const name=(k,i)=>get(k,i)?.nombre||'—';const opt=k=>db[k].map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join('');const tab=(heads,rows)=>`<div class="scroll"><table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>`;const field=(n,t='text',extra='')=>`<label>${n}<input name="${n}" type="${t}" ${extra} required></label>`;const formData=f=>Object.fromEntries(new FormData(f));const qty=(pid)=>db.facturas.filter(x=>x.producto===pid).reduce((s,x)=>s+Number(x.cantidad),0)+db.movimientos.filter(x=>x.producto===pid).reduce((s,x)=>s+(x.tipo==='devolucion'?Number(x.cantidad):-Number(x.cantidad)),0);const stockCost=pid=>{let purchases=db.facturas.filter(x=>x.producto===pid);let total=purchases.reduce((s,x)=>s+Number(x.cantidad)*Number(x.precio),0),count=purchases.reduce((s,x)=>s+Number(x.cantidad),0);return count?total/count:0};const voice=(target)=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Dictado no disponible en este navegador. Puedes usar el micrófono del teclado.');let r=new SR();r.lang='es-MX';r.onresult=e=>{target.value=e.results[0][0].transcript};r.start()};function voiceButtons(){document.querySelectorAll('input[type=text],textarea').forEach(x=>{let b=document.createElement('button');b.type='button';b.textContent='🎙 Dictar';b.onclick=()=>voice(x);x.after(b)})}function section(html){document.querySelector('#app').innerHTML=html;voiceButtons()}let current='Inicio';const tabs=['Inicio','Proveedores','Productos','Proyectos','Facturas','Almacén','Gastos','Reportes','Respaldo'];document.querySelector('#nav').innerHTML=tabs.map(t=>`<button data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));function show(t){current=t;let html='';if(t==='Inicio'){let purchased=db.facturas.reduce((s,x)=>s+x.cantidad*x.precio,0),spent=db.movimientos.filter(x=>x.tipo==='asignacion').reduce((s,x)=>s+x.cantidad*x.costo,0);html=`<div class="panel"><h2>Resumen</h2><p>Compras registradas: <b>${money(purchased)}</b></p><p>Material asignado a proyectos: <b>${money(spent)}</b></p><p>Facturas / partidas: ${db.facturas.length} · Proyectos: ${db.proyectos.length}</p><p class="muted">Para empezar: registra proveedor, producto y proyecto; después una compra.</p></div>`}
if(t==='Proveedores'||t==='Productos'||t==='Proyectos'){let k=t.toLowerCase(),extra=k==='proveedores'?field('telefono')+field('correo','email'):k==='productos'?field('unidad')+field('costo','number','step="0.01" min="0"')+field('marca')+field('modelo')+field('especificaciones')+`<label>Enlace a ficha técnica<input name="datasheet" type="url" placeholder="https://..."></label>`:`<label>Presupuesto opcional<input name="presupuesto" type="number" step="0.01" min="0"></label>`;html=`<div class="panel"><h2>${t}</h2><form id="add">${field('nombre')}${extra}<button>Guardar</button></form></div><div class="panel">${tab(k==='productos'?['Nombre','Unidad','Costo','Ficha técnica']:['Nombre','Detalle'],db[k].map(x=>k==='productos'?[esc(x.nombre),esc(x.unidad),money(x.costo),x.datasheet?`<a href="${esc(x.datasheet)}" target="_blank" rel="noopener">Abrir</a>`:'—']:[esc(x.nombre),k==='proveedores'?esc(x.correo):x.presupuesto?money(x.presupuesto):'Sin presupuesto']))}</div>`}
if(t==='Facturas'){html=`<div class="panel"><h2>Registrar partida de factura / compra</h2><p class="muted">En esta versión las partidas se capturan manualmente. Importación XML pendiente.</p><form id="add"><label>Proveedor<select name="proveedor" required>${opt('proveedores')}</select></label>${field('folio')}${field('fecha','date')}<label>Producto<select name="producto">${opt('productos')}</select></label>${field('cantidad','number','min="0.001" step="0.001"')}${field('precio','number','min="0" step="0.01"')}<button>Agregar partida</button></form></div><div class="panel">${tab(['Proveedor','Folio','Producto','Cantidad','Importe'],db.facturas.map(x=>[esc(name('proveedores',x.proveedor)),esc(x.folio),esc(name('productos',x.producto)),x.cantidad,money(x.cantidad*x.precio)]))}</div>`}
if(t==='Almacén'){html=`<div class="panel"><h2>Inventario</h2>${tab(['Producto','Disponible','Costo promedio','Valor estimado'],db.productos.map(x=>[esc(x.nombre),`${qty(x.id)} ${esc(x.unidad)}`,money(stockCost(x.id)),money(qty(x.id)*stockCost(x.id))]))}</div><div class="panel"><h3>Asignar o devolver material</h3><form id="add"><label>Movimiento<select name="tipo"><option value="asignacion">Asignar a proyecto</option><option value="devolucion">Devolver al almacén</option></select></label><label>Proyecto<select name="proyecto">${opt('proyectos')}</select></label><label>Producto<select name="producto">${opt('productos')}</select></label>${field('cantidad','number','min="0.001" step="0.001"')}<button>Registrar movimiento</button></form></div><div class="panel">${tab(['Tipo','Proyecto','Producto','Cantidad'],db.movimientos.map(x=>[esc(x.tipo),esc(name('proyectos',x.proyecto)),esc(name('productos',x.producto)),x.cantidad]))}</div>`}
if(t==='Gastos'){html=`<div class="panel"><h2>Gastos adicionales por proyecto</h2><form id="add"><label>Proyecto<select name="proyecto">${opt('proyectos')}</select></label>${field('concepto')}${field('proveedor')}${field('importe','number','min="0" step="0.01"')}<button>Guardar gasto</button></form></div><div class="panel">${tab(['Proyecto','Concepto','Proveedor','Importe'],db.gastos.map(x=>[esc(name('proyectos',x.proyecto)),esc(x.concepto),esc(x.proveedor),money(x.importe)]))}</div>`}
if(t==='Reportes'){html=`<div class="panel"><h2>Gasto por proyecto</h2>${tab(['Proyecto','Material asignado neto','Otros gastos','Total','Presupuesto'],db.proyectos.map(p=>{let material=db.movimientos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+(x.tipo==='asignacion'?1:-1)*x.cantidad*x.costo,0),other=db.gastos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+Number(x.importe),0);return [esc(p.nombre),money(material),money(other),money(material+other),p.presupuesto?money(p.presupuesto):'No definido']}))}<button onclick="downloadCSV()">Exportar reporte CSV (Excel)</button></div>`}
if(t==='Respaldo'){html=`<div class="panel"><h2>Respaldo</h2><p>Descarga todos los registros en un archivo JSON para conservarlos antes de cambiar de equipo.</p><button onclick="backup()">Descargar respaldo</button><label>Restaurar respaldo JSON<input id="restore" type="file" accept=".json,application/json"></label><p class="muted">La información de esta versión NO se sincroniza entre dispositivos. No guardes datos sensibles en una publicación pública.</p></div>`}section(html);let f=document.querySelector('#add');if(f)f.onsubmit=e=>{e.preventDefault();let x=formData(f);if(t==='Almacén'){let n=Number(x.cantidad);if(n<=0)return alert('Cantidad inválida');let available=qty(x.producto);if(x.tipo==='asignacion'&&n>available)return alert('No hay suficiente material');if(x.tipo==='devolucion'){let assigned=db.movimientos.filter(m=>m.proyecto===x.proyecto&&m.producto===x.producto).reduce((s,m)=>s+(m.tipo==='asignacion'?1:-1)*m.cantidad,0);if(n>assigned)return alert('La devolución supera lo asignado a este proyecto')}x.costo=stockCost(x.producto)}if(t==='Facturas'){if(!x.producto||!x.proveedor)return alert('Registra primero proveedor y producto');if(db.facturas.some(a=>a.proveedor===x.proveedor&&a.folio===x.folio&&a.producto===x.producto))return alert('Ya existe este producto en esa factura');}for(let key of ['cantidad','precio','importe','costo','presupuesto'])if(x[key]!==undefined&&x[key]!=='')x[key]=Number(x[key]);if(['Facturas','Almacén'].includes(t)&&(!Number.isFinite(x.cantidad)||x.cantidad<=0))return alert('Cantidad inválida');db[t==='Almacén'?'movimientos':t.toLowerCase()].push({...x,id:id()});save();show(t)};let restore=document.querySelector('#restore');if(restore)restore.onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!['proveedores','productos','proyectos','facturas','movimientos','gastos'].every(k=>Array.isArray(d[k])))throw Error();if(confirm('¿Reemplazar los datos actuales con este respaldo?')){db=d;save();show('Inicio')}}catch{alert('Archivo de respaldo no válido')}}}
function download(content,filename,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(JSON.stringify(db,null,2),'respaldo-compras.json','application/json')}function downloadCSV(){let rows=[['Proyecto','Material','Otros gastos','Total']];db.proyectos.forEach(p=>{let m=db.movimientos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+(x.tipo==='asignacion'?1:-1)*x.cantidad*x.costo,0),g=db.gastos.filter(x=>x.proyecto===p.id).reduce((s,x)=>s+Number(x.importe),0);rows.push([p.nombre,m.toFixed(2),g.toFixed(2),(m+g).toFixed(2)])});download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'gastos-por-proyecto.csv','text/csv;charset=utf-8')}show('Inicio');
</script></body></html>
